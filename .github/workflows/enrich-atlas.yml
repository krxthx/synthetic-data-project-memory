name: Enrich Atlas project corpus

on:
  push:
    branches: [main]
    paths:
      - 'generator/enrich_atlas.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-atlas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document dependencies
        run: pip install python-docx reportlab
      - name: Enrich Atlas corpus and artifacts
        run: python generator/enrich_atlas.py
      - name: Commit Atlas enrichment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/atlas data/all_records.jsonl
          git commit -m 'Enrich Atlas project memory corpus' || exit 0
          git push origin main
