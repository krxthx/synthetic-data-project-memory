name: Generate synthetic project-memory corpus

on:
  push:
    branches: [populate-synthetic-corpus]
    paths:
      - 'generator/**'
      - '.github/workflows/generate-dataset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: populate-synthetic-corpus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artifact dependencies
        run: pip install python-docx reportlab
      - name: Generate corpus
        run: python generator/generate_dataset.py
      - name: Commit generated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Generate full 2000-record synthetic project-memory corpus' || exit 0
          git push origin populate-synthetic-corpus
